name: macOS release
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Native Mac builder (use the alternate pool if one is busy)
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-15-intel
          - macos-14
permissions:
  contents: read
jobs:
  universal:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build universal application and release ZIP
        run: bash cpp/tools/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            releases/Phase-Distorter-*-macos-universal.zip
            build/macos-release/macos-verification.tar.gz
          if-no-files-found: error
      - name: Test on the build host
        run: bash cpp/tools/test-macos-release.sh
  intel:
    needs: universal
    runs-on: ${{ inputs.runner == 'macos-15-intel' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-universal
      - name: Test the same application on the other CPU architecture
        run: bash cpp/tools/test-macos-release.sh
